name: Build SOMA Current Rig Pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rig-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Soma-Lab
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned NVIDIA SOMA-X v0.2.x assets
        run: |
          git lfs install
          rm -rf .soma-upstream
          GIT_LFS_SKIP_SMUDGE=1 git clone --no-checkout https://github.com/NVlabs/SOMA-X.git .soma-upstream
          git -C .soma-upstream checkout 86632764684281dc98f31ab9c4aac36a4cdbc428
          git -C .soma-upstream lfs pull --include="assets/SOMA_template_rig.usda,assets/SOMA_neutral.npz"

      - name: Install extractor dependencies
        run: python -m pip install --upgrade numpy scipy usd-core

      - name: Extract compact browser rig pack
        run: python extract_current_rig_pack.py .soma-upstream soma_current_rig_pack_v0026.npz

      - name: Commit rig pack into Soma-Lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soma_current_rig_pack_v0026.npz soma_current_rig_pack_v0026.json
          if git diff --cached --quiet; then
            echo "Rig pack already current."
          else
            git commit -m "Add generated SOMA v0026 browser rig pack"
            git push
          fi
