name: Sammy Pose Oracle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pose-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Soma-Lab
        uses: actions/checkout@v4

      - name: Check pose probe
        run: |
          test -f pose_probe_input.json || (echo "pose_probe_input.json fehlt im Repo-Root." && exit 2)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned official Anny v0.6
        run: |
          rm -rf .anny-upstream
          git clone https://github.com/naver/anny.git .anny-upstream
          git -C .anny-upstream checkout 72104cac8242d1735ec06433b65bec5e26953ce7

      - name: Install official Anny
        run: python -m pip install -e ./.anny-upstream

      - name: Run official pose oracle
        run: python pose_oracle.py pose_probe_input.json pose_probe_oracle.json

      - name: Commit Oracle result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pose_probe_oracle.json
          git commit -m "Add Sammy pose oracle result" || echo "Oracle result unchanged"
          git push
